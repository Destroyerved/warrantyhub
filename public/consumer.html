<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My warranties — WarrantyHub</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="logo" href="/"><span class="logo-mark">W</span> WarrantyHub</a>
      <div class="topbar-right">
        <span class="muted" data-user-name></span>
        <button class="btn secondary small" onclick="logout()">Log out</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <nav class="tabs">
      <a href="#warranties">My warranties</a>
      <a href="#claims">My claims</a>
    </nav>

    <!-- Warranties -->
    <section data-tab="warranties">
      <div class="card">
        <h2>Register a product</h2>
        <p class="muted small">Find the serial number on the product label, box or invoice. Warranty starts from your purchase date.</p>
        <form id="registerForm" class="grid grid-4" style="align-items:end">
          <div class="field" style="margin:0">
            <label for="rCompany">Brand</label>
            <select id="rCompany" name="companyId" required></select>
          </div>
          <div class="field" style="margin:0">
            <label for="rSerial">Serial number</label>
            <input id="rSerial" name="serial" placeholder="TV55-0002" required>
          </div>
          <div class="field" style="margin:0">
            <label for="rDate">Purchase date</label>
            <input id="rDate" name="purchaseDate" type="date" required>
          </div>
          <div class="field" style="margin:0">
            <label for="rInvoice">Invoice no. <span class="hint">(optional)</span></label>
            <input id="rInvoice" name="invoiceNo">
          </div>
          <button class="btn" type="submit">Activate warranty</button>
        </form>
      </div>

      <h2 style="margin-top:28px">My products</h2>
      <div class="grid grid-3" id="warrantyList"></div>
    </section>

    <!-- Claims -->
    <section data-tab="claims" class="hidden">
      <div class="card" id="claimFormCard">
        <h2>File a warranty claim</h2>
        <form id="claimForm">
          <div class="field">
            <label for="cUnit">Product</label>
            <select id="cUnit" name="unitId" required></select>
          </div>
          <div class="field">
            <label for="cIssue">What's wrong?</label>
            <textarea id="cIssue" name="issue" maxlength="2000" placeholder="Describe the problem, when it started, and anything you've already tried." required></textarea>
          </div>
          <button class="btn" type="submit">Submit claim</button>
        </form>
      </div>

      <h2 style="margin-top:28px">Claim history</h2>
      <div id="claimList"></div>
    </section>
  </main>

  <script src="/common.js"></script>
  <script src="/consumer.js"></script>
</body>
</html>
